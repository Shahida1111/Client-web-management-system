<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Client Details - WebFlow CMS</title>

    <link
        rel="stylesheet"
        href="../css/main.css"
    >

</head>

<body>

    <div class="app">

        <!-- ========================================
             Sidebar
        ========================================= -->

        <aside class="sidebar">

            <div class="sidebar__logo">
                WebFlow CMS
            </div>

            <nav class="sidebar__nav">

                <a
                    href="../index.html"
                    class="sidebar__link"
                >
                    Dashboard
                </a>

                <a
                    href="clients.html"
                    class="sidebar__link sidebar__link--active"
                >
                    Clients
                </a>

                <a
                    href="websites.html"
                    class="sidebar__link"
                >
                    Websites
                </a>

                <a
                    href="#"
                    class="sidebar__link"
                >
                    Tasks
                </a>

                <a
                    href="#"
                    class="sidebar__link"
                >
                    QA
                </a>

                <a
                    href="#"
                    class="sidebar__link"
                >
                    Settings
                </a>

            </nav>

        </aside>


        <!-- ========================================
             Main Area
        ========================================= -->

        <div class="app__main">

            <!-- Header -->

            <header class="header">

                <button
                    class="header__menu"
                    id="menuToggle"
                >
                    ☰
                </button>

                <div class="header__title">
                    Client Details
                </div>

            </header>


            <!-- Main Content -->

            <main class="main-content">

                <div class="page-heading">

                    <div>

                        <h2 id="clientName">
                            Client Details
                        </h2>

                        <p>
                            View client information.
                        </p>

                    </div>

                    <a
                        href="clients.html"
                        class="btn btn--secondary"
                    >
                        ← Back to Clients
                    </a>

                </div>


                <!-- Client Details Card -->

                <div class="client-details-card">

                    <div class="client-details-card__header">

                        <div>

                            <h3 id="detailClientName">
                                -
                            </h3>

                            <span
                                class="badge"
                                id="detailClientStatus"
                            >
                                -
                            </span>

                        </div>

                    </div>


                    <div class="client-details-grid">

                        <div class="client-detail-item">

                            <span class="client-detail-item__label">
                                Industry
                            </span>

                            <strong
                                id="detailClientIndustry"
                            >
                                -
                            </strong>

                        </div>


                        <div class="client-detail-item">

                            <span class="client-detail-item__label">
                                Websites
                            </span>

                            <strong
                                id="detailClientWebsites"
                            >
                                -
                            </strong>

                        </div>


                        <div class="client-detail-item">

                            <span class="client-detail-item__label">
                                Client ID
                            </span>

                            <strong
                                id="detailClientId"
                            >
                                -
                            </strong>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>


    <script
        type="module"
        src="../js/modules/client-details.js"
    ></script>

</body>

</html>
