<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WebFlow CMS</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <!-- Application -->
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar__logo">
          <h2>WebFlow</h2>
          <span>CMS</span>
        </div>

        <nav class="sidebar__nav">
          <a href="#" class="sidebar__link sidebar__link--active">
            <span>▣</span>
            <span>Dashboard</span>
          </a>

          <a href="pages/clients.html" class="sidebar__link">
            <span>👥</span>
            <span>Clients</span>
          </a>

          <a href="pages/websites.html" class="sidebar__link">
            <span>🌐</span>
            <span>Websites</span>
          </a>

          <a href="#" class="sidebar__link">
            <span>✓</span>
            <span>Tasks</span>
          </a>

          <a href="#" class="sidebar__link">
            <span>⚠</span>
            <span>QA</span>
          </a>
        </nav>

        <div class="sidebar__footer">
          <a href="#" class="sidebar__link">
            <span>⚙</span>
            <span>Settings</span>
          </a>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- Main Application -->
      <div class="app__main">
        <!-- Header -->
        <header class="header">
          <div class="header__left">
            <button class="header__menu" id="menuToggle">☰</button>

            <h1>Dashboard</h1>
          </div>

          <div class="header__right">
            <button class="header__notification">🔔</button>

            <div class="header__user">
              <div class="header__avatar">SI</div>

              <div class="header__user-info">
                <strong>Shahida Ibrahim</strong>
                <span>Web Developer</span>
              </div>
            </div>
          </div>
        </header>

        <!-- Page Content -->
        <main class="main-content">
          <div class="container">
            <div class="page-title">
              <h2>Dashboard</h2>
              <p>Welcome back to WebFlow CMS.</p>
            </div>

            <!-- Temporary test content -->
            <div class="dashboard-grid">
              <!-- Total Clients -->
              <div class="stat-card">
                <div class="stat-card__top">
                  <div class="stat-card__icon">👥</div>

                  <span class="stat-card__label"> Clients </span>
                </div>

                <div class="stat-card__value">24</div>

                <div class="stat-card__footer">
                  <span class="stat-card__change stat-card__change--positive">
                    ↑ 12%
                  </span>

                  <span> from last month </span>
                </div>
              </div>

              <!-- Active Websites -->
              <div class="stat-card">
                <div class="stat-card__top">
                  <div class="stat-card__icon">🌐</div>

                  <span class="stat-card__label"> Active Websites </span>
                </div>

                <div class="stat-card__value">18</div>

                <div class="stat-card__footer">
                  <span class="stat-card__change stat-card__change--positive">
                    ↑ 8%
                  </span>

                  <span> from last month </span>
                </div>
              </div>

              <!-- Pending Tasks -->
              <div class="stat-card">
                <div class="stat-card__top">
                  <div class="stat-card__icon">✓</div>

                  <span class="stat-card__label"> Pending Tasks </span>
                </div>

                <div class="stat-card__value">12</div>

                <div class="stat-card__footer">
                  <span class="stat-card__change stat-card__change--warning">
                    4 due today
                  </span>
                </div>
              </div>

              <!-- QA Issues -->
              <div class="stat-card">
                <div class="stat-card__top">
                  <div class="stat-card__icon">⚠</div>

                  <span class="stat-card__label"> QA Issues </span>
                </div>

                <div class="stat-card__value">5</div>

                <div class="stat-card__footer">
                  <span class="stat-card__change stat-card__change--danger">
                    2 critical
                  </span>
                </div>
              </div>
            </div>
            >
          </div>
        </main>
      </div>
    </div>

    <!-- JavaScript -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
